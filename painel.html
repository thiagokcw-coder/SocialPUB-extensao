<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SocialPUB — teste no X</title>
<style>
  :root { --bg:#0f1117; --sf:#171a23; --bd:#2a2f3d; --tx:#e6e8ee; --mt:#8b91a1; --ok:#22c55e; --er:#ef4444; --am:#f59e0b; --ac:#6366f1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 system-ui, Segoe UI, sans-serif; }
  main { max-width: 680px; margin: 28px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 span { color: var(--ac); }
  .sub { color: var(--mt); margin-bottom: 18px; }
  .caixa { background:var(--sf); border:1px solid var(--bd); border-radius:10px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:12px; color:var(--mt); margin-bottom:5px; }
  textarea, input[type=file], input[type=url] { width:100%; background:var(--bg); color:var(--tx); border:1px solid var(--bd); border-radius:8px; padding:8px; font:inherit; }
  textarea { min-height: 110px; resize: vertical; }
  .cont { font-size:11px; color:var(--mt); text-align:right; margin-top:3px; }
  .cont.passou { color: var(--am); }
  .metodo { display:flex; gap:10px; align-items:flex-start; padding:8px; border-radius:8px; cursor:pointer; }
  .metodo:hover { background: var(--bg); }
  .metodo small { display:block; color:var(--mt); }
  button { background:var(--ac); color:#fff; border:0; border-radius:8px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #log { white-space:pre-wrap; font:12px/1.5 ui-monospace, Consolas, monospace; color:var(--mt); min-height:40px; }
  .ok { color: var(--ok); } .er { color: var(--er); } .am { color: var(--am); }
</style>
</head>
<body>
<main>
  <h1>Social<span>PUB</span> — teste no X</h1>
  <div class="sub">Abre o compositor do X, anexa, escreve, confere — e <b>para antes de postar</b>. Quem clica em Postar é você.</div>

  <div class="caixa">
    <label for="url">Link do vídeo ou da imagem — o que o Grok gerou</label>
    <input id="url" type="url" placeholder="https://…/video.mp4">
    <label for="arq" style="margin-top:10px">…ou um arquivo deste computador</label>
    <input id="arq" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime">
    <div class="cont" style="text-align:left">Se os dois estiverem preenchidos, vale o link.</div>
  </div>

  <div class="caixa">
    <label for="leg">Legenda</label>
    <textarea id="leg" placeholder="Escreva com acentos, uma quebra de linha e uma #hashtag — é isso que o teste precisa provar."></textarea>
    <div class="cont" id="cont">0 / 280</div>
  </div>

  <div class="caixa">
    <label>Como escrever</label>
    <label class="metodo"><input type="radio" name="metodo" value="teclado" checked>
      <span><b>B · Teclado real</b> — o padrão<small>Teclas reais pela API de depuração, como no app. Enquanto escreve, o Chrome mostra a faixa amarela "está depurando". Medido no X em 13/11: a #hashtag fica azul, como digitada por uma pessoa.</small></span></label>
    <label class="metodo"><input type="radio" name="metodo" value="texto">
      <span><b>A · Texto do navegador</b><small>Sem faixa amarela, mas no X (13/11) a #hashtag ficou BRANCA: o texto entra na tela e o editor não o processa como digitação. Só para comparar em outras redes.</small></span></label>
  </div>

  <button id="ir">Preencher no X</button>

  <div class="caixa" style="margin-top:12px">
    <label>Relatório</label>
    <div id="log">—</div>
  </div>
</main>
<script src="receitas.js"></script>
<script src="arquivo.js"></script>
<script src="acoes.js"></script>
<script src="teclado.js"></script>
<script src="painel.js"></script>
</body>
</html>
